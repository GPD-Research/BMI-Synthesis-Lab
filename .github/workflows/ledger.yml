name: v2 parameter ledger

on:
  pull_request:
    paths:
      - "v2/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "v2/**"
      - "tests/**"

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/check_ledger.py
      - run: pip install "sympy>=1.12,<2"
      - run: python3 tests/check_background.py
