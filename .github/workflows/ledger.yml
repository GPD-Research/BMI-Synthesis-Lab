name: v2 parameter ledger

on:
  pull_request:
    paths:
      - "v2/**"
      - "tests/**"
      - "viewer/**"
      - "RETRACTED.md"
      - ".github/workflows/ledger.yml"
  push:
    branches: [main]
    paths:
      - "v2/**"
      - "tests/**"
      - "viewer/**"
      - "RETRACTED.md"
      - ".github/workflows/ledger.yml"

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/check_ledger.py
      - run: pip install "pyyaml>=6,<7"
      - run: python3 tests/check_map.py
      - run: pip install "sympy>=1.12,<2"
      - run: python3 tests/check_background.py
      - run: python3 tests/check_brane_eq.py
      - run: python3 tests/check_zero_modes.py
      - run: python3 tests/check_radion.py
      - run: python3 tests/thick_brane.py
      - run: pip install numpy scipy
      - run: python3 tests/background_frw.py
      - run: python3 tests/impact.py
      - run: python3 tests/scan_initial_conditions.py
      - run: python3 tests/approach.py
      - run: python3 tests/circle.py
      - run: python3 tests/dark_sector.py
      - run: python3 tests/predictions.py
      - run: python3 tests/p2_chains.py
      - run: python3 tests/p2_direct.py
      - run: python3 tests/exchange.py
      - run: python3 tests/radion_llr.py
      - run: python3 tests/radion_hz.py
      - run: python3 tests/zt_tcmb.py
      - run: python3 tests/clock_effect.py
      - run: python3 tests/g_ringdown.py
