name: Theory map site

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "v2/map.yaml"
      - "v2/map_v1.yaml"
      - "tests/build_map.py"
      - "tests/check_map.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}viewer/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6,<7"
      - run: python3 tests/check_map.py
      # Publish only the viewer; the rest of the repo stays on GitHub.
      - run: |
          mkdir _site
          cp -r viewer _site/
          touch _site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=viewer/"><a href="viewer/">BMI theory map</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
