# BMI v2 theory map. Curated by hand; checked by tests/check_map.py; drawn by viewer/index.html.
# A box: id, tier, kind, status, title, and where it lives (file, section, test).
# A link (in `from:`): link: verified needs `by:` (the file section or test that shows it);
# link: open means the connection is not yet worked out ("?" on the line).
# needs: a number this box needs that the action does not supply ("!" badge).
meta:
  version: v2
  title: "BMI v2: from the axiom to the data"
  summary: "Parameter budget frozen at 9; balance 0 − 9 = −9. P1 (fifth force) open, P2 (dark energy) killed. Next: ΔN_eff, the Hubble tension, a second dark-sector handle."
  tiers:
    - Axiom
    - Action and choices
    - Effective 4D theory
    - Derived consequences
    - Sectors
    - Parameters (frozen at 9)
    - Predictions, forks and open questions
    - Data and kill tests

