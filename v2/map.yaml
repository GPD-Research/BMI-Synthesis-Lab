    tier: 0
    kind: axiom
    status: axiom
    title: "Two branes collided and are slowly merging"
    file: v2/00_axiom.md
    section: "What the axiom commits to"
    notes: "The one v1 idea that survived the audit (RETRACTED.md, 'Kept as the v2 axiom')."
  - id: pre_action
    tier: 0
    kind: leap
    status: paused
    title: "Pre-action layer: independent universes, crystallization"
    file: v2/00_axiom.md
    section: "Pre-action layer"
    notes: "Hypothesis; not used by any derivation."
