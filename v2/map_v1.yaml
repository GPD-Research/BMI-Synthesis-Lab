# BMI v1 theory map: the frozen manuscript as audited in v2/v1_chapter_audit.md,
# v2/ledger_v1_audit.md and RETRACTED.md. Same schema as v2/map.yaml.
# Extra fields used here:
#   critical: true   one of the failures that sank v1 (drawn in red)
#   trap:            the failure mode, from the trap list in meta.traps
#   guard:           what v2 does so the same failure cannot pass silently
#   v2:              the v2 box this idea became, if it survived
#   link: broken     a link that was claimed but shown not to hold (red ✗)
meta:
  version: v1
  title: "BMI v1 (frozen manuscript): where it failed"
  summary: "21 constants, 14 free functions, per-state integers; 0 derived numbers. Hard stop at the first equation (Ch 1 §1.2); every quantitative claim retracted or suspended."
  tiers:
    - Premise
    - First equation (hard stop)
    - Names added without definitions
    - Claimed derivations
    - Claimed validations
    - Net result
  traps:
    null-content: "An equation whose every symbol is free: it can fit anything and predict nothing."
    free-function: "A new named function or tensor with no form derived; infinite freedom."
    symbol-clash: "One symbol used with incompatible values or meanings."
    dimensional: "Quantities with different units added or equated."
    self-validation: "A claim described as validated by a check that never ran or compared nothing with data."
    circular: "A constant inferred from the data it is then said to predict."
    artifact: "A signal produced by the analysis pipeline, not the data."
    contradiction: "Two parts of the theory that cannot both hold."
    identity-as-evidence: "A tautology or standard identity presented as evidence."
    no-fit: "An explanation with no profile to fit, or one that does not beat the null."

